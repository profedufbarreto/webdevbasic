<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
<h3>Formulário</h3>
<form action="">
    <!-- TEXT -->
<!-- REQUIRED + PLACEHOLDER -->
  <label for="nome">Nome:</label>
  <input type="text" id="nome" placeholder="Seu nome completo" required>
  <br><br>

  <!-- MAXLENGTH -->
  <label for="usuario">Usuário (máx 10 caracteres):</label>
  <input type="text" id="usuario" maxlength="10" placeholder="Máx 10 chars" required>
  <br><br>

  <!-- EMAIL + REQUIRED -->
  <label for="email">Email:</label>
  <input type="email" id="email" placeholder="seu@email.com" required>
  <br><br>

  <!-- PASSWORD + PATTERN -->
  <label for="senha">Senha (mín 6, só letras e números):</label>
  <input type="password" id="senha" pattern="[a-zA-Z0-9]{6,}" placeholder="Mínimo 6 caracteres" required>
  <br><br>

  <!-- NUMBER + MIN/MAX -->
  <label for="idade">Idade (13 a 99):</label>
  <input type="number" id="idade" min="13" max="99" required>
  <br><br>

  <!-- DATE + MIN/MAX -->
  <label for="data">Data (só em 2026):</label>
  <input type="date" id="data" min="2026-01-01" max="2026-12-31">
  <br><br>

  <!-- TEL + PATTERN -->
  <label for="telefone">Telefone (formato (XX) XXXXX-XXXX):</label>
  <input type="tel" id="telefone" pattern="\([0-9]{2}\) [0-9]{5}-[0-9]{4}" placeholder="(51) 99999-9999">
  <br><br>

  <!-- RANGE + MIN/MAX -->
  <label for="nota">Nota (0 a 10):</label>
  <input type="range" id="nota" min="0" max="10" value="7">
  <br><br>

  <!-- DISABLED -->
  <label for="codigo">Código (gerado automaticamente):</label>
  <input type="text" id="codigo" value="ALU-2026-001" disabled>
  <br><br>

  <button type="submit">Enviar</button>
</form>

</body>
</html>
