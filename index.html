<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atividade 3.5</title>
</head>
<body>

  <h1>Tabela de Colegas</h1>

  <table border="1">
    <thead>
      <tr>
        <th>Nome</th>
        <th>Idade</th>
        <th>Hobby</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>Lucas</td>
        <td>15</td>
        <td>Jogos</td>
      </tr>
      <tr>
        <td>Ana</td>
        <td>16</td>
        <td>Desenhar</td>
      </tr>
      <tr>
        <td>Pedro</td>
        <td>14</td>
        <td>Futebol</td>
      </tr>
      <tr>
        <td>Julia</td>
        <td>15</td>
        <td>Música</td>
      </tr>
      <tr>
        <td>Rafael</td>
        <td>16</td>
        <td>Programação</td>
      </tr>
    </tbody>
  </table>

  <br>

  <h1>Cadastro</h1>

  <form>
    <!-- 1. TEXT -->
    <label for="nome">Nome:</label>
    <input type="text" id="nome" placeholder="Seu nome" required>
    <br><br>

    <!-- 2. EMAIL -->
    <label for="email">Email:</label>
    <input type="email" id="email" placeholder="seu@email.com" required>
    <br><br>

    <!-- 3. PASSWORD -->
    <label for="senha">Senha:</label>
    <input type="password" id="senha" minlength="6" required>
    <br><br>

    <!-- 4. NUMBER -->
    <label for="idade">Idade:</label>
    <input type="number" id="idade" min="13" max="99" required>
    <br><br>

    <!-- 5. DATE -->
    <label for="nascimento">Data de nascimento:</label>
    <input type="date" id="nascimento">
    <br><br>

    <!-- 6. COLOR -->
    <label for="cor">Cor favorita:</label>
    <input type="color" id="cor" value="#3498db">
    <br><br>

    <button type="submit">Cadastrar</button>
  </form>

</body>
</html>
